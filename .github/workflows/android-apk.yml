name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read the web build number
        run: |
          BUILD=$(grep -oE 'APP_BUILD = "[0-9]+"' js/app.js | head -1 | grep -oE '[0-9]+')
          echo "TALK_BUILD=${BUILD:-dev}" >> "$GITHUB_ENV"

      - name: Assemble local web bundle
        run: npm run build:web

      - name: Generate and configure Capacitor Android project
        run: |
          npx cap add android
          node scripts/setup-android-native.mjs
          npx cap sync android

      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/talk-release.jks"

      - name: Build release APK
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        if: env.KEYSTORE_B64 != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/talk-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/talk-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "talk-${TALK_BUILD}-release.apk" \
            "$RUNNER_TEMP/talk-aligned.apk"
          "$BT/apksigner" verify --print-certs "talk-${TALK_BUILD}-release.apk"

      - name: Build debug APK (no signing secrets configured)
        if: env.KEYSTORE_B64 == ''
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the APK to a GitHub Release
        if: env.KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="talk. ${GITHUB_REF_NAME}"
            NOTES="Built from ${GITHUB_SHA:0:7} · build ${TALK_BUILD}."
          else
            TAG="apk-latest"
            TITLE="talk. APK (latest)"
            NOTES="Built from ${GITHUB_SHA:0:7} · build ${TALK_BUILD} · $(date -u +%FT%TZ)"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
          gh release upload "$TAG" "talk-${TALK_BUILD}-release.apk" --clobber
          # Keep only the newest APK attached to the rolling release.
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            if [ "$asset" != "talk-${TALK_BUILD}-release.apk" ]; then
              gh release delete-asset "$TAG" "$asset" -y || true
            fi
          done
          gh release edit "$TAG" --notes "$NOTES"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talk-android-${{ env.TALK_BUILD }}
          path: |
            talk-*.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
