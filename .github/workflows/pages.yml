name: Deploy Talk to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Rapid pushes used to cancel a run between upload and deploy, which leaves
  # the deploy job with "Found 0 artifact(s)". Queue them instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html favicon.svg manifest.webmanifest sw.js .nojekyll LICENSE dist/
          cp -r icons css js vendor dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # deploy-pages@v4 looks for exactly this name.
          name: github-pages
          path: dist

      - name: List the artifact contents
        run: find dist -maxdepth 2 -type f | head -20

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # The Pages artifact API occasionally returns 0 artifacts right after an
      # upload. One retry a few seconds later clears it.
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
